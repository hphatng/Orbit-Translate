<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Orbit Translate - Toolbar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand {
      font-weight: 800;
      font-size: 16px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 10px;
      background: #1e293b;
      color: #10b981;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .search-box {
      margin-bottom: 14px;
    }
    .search-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .search-input:focus { border-color: #38bdf8; }
    
    .stats-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
      text-align: center;
    }
    .stat-val {
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
    }
    .stat-label {
      font-size: 11px;
      color: #94a3b8;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-primary:hover { background: #0369a1; }
    .btn-quizlet { background: #4255ff; color: #fff; }
    .btn-quizlet:hover { background: #3243d4; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">🚀 Orbit Translate</div>
    <div class="status-badge" id="sync-status-badge">● Guest Mode</div>
  </div>

  <div class="search-box">
    <input type="text" class="search-input" id="search-input" placeholder="Tra từ trực tiếp tại đây..." />
  </div>

  <div class="stats-card">
    <div>
      <div class="stat-val" id="stat-total">0</div>
      <div class="stat-label">Từ vựng đã lưu</div>
    </div>
    <div>
      <div class="stat-val" id="stat-due" style="color: #f59e0b;">0</div>
      <div class="stat-label">Từ đến lịch SRS</div>
    </div>
    <div style="grid-column: span 2; margin-top: 8px; border-top: 1px solid #334155; padding-top: 8px;">
      <div class="stat-val" id="stat-sync" style="font-size: 14px;">Offline</div>
      <div class="stat-label">Trạng thái đồng bộ</div>
    </div>
  </div>

  <button class="btn btn-primary" id="open-web">
    📊 Mở WebApp Dashboard
  </button>
  <button class="btn btn-quizlet" id="export-quizlet">
    ⚡ 1-Click Export Quizlet (CSV)
  </button>

  <script src="popup.js"></script>
</body>
</html>
